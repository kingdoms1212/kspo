<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180"><rect width="1800" height="1180" fill="#F5F8FC"/><text x="48" y="74" font-family="Malgun Gothic,sans-serif" font-size="42" font-weight="700" fill="#19324F">Hi스포링 · 주요 정책 크롤링 아키텍처</text><text x="48" y="120" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#617792">현재 코드 기준 · 2026.09.29  |  요청 시 목록 수집 · 메모리 캐시 재사용 · 다이얼로그 부분 갱신</text><rect x="48" y="180" width="520" height="240" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="180" width="520" height="60" rx="16" fill="#148BDD" stroke="#148BDD" stroke-width="2"/><text x="68" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">01  브라우저 · 주요 정책 보기</text><text x="68" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">클릭 즉시 다이얼로그 · 로딩 안내 표시</text><text x="68" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">HTMX GET /policies → Django 요청</text><text x="68" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">외부 사이트 조회는 서버에서 수행</text><rect x="640" y="180" width="520" height="240" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="180" width="520" height="60" rx="16" fill="#0FA580" stroke="#0FA580" stroke-width="2"/><text x="660" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">02  Django · 정책 캐시 확인</text><text x="660" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">View → Service → policies.models</text><text x="660" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">프로세스 메모리의 결과 · 경과시간 확인</text><text x="660" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">성공 900초 / 실패 60초 동안 재사용</text><rect x="1232" y="180" width="520" height="240" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="180" width="520" height="60" rx="16" fill="#8562D9" stroke="#8562D9" stroke-width="2"/><text x="1252" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">03  캐시 없음·만료 → HTML 수집</text><text x="1252" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">문화체육관광부 체육정책 목록</text><text x="1252" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">urllib.request · User-Agent 지정</text><text x="1252" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">타임아웃 6초 / 읽기 최대 2,000,000B</text><polyline points="568,280 632,280" fill="none" stroke="#148BDD" stroke-width="3"/><polygon points="632,280 618,272 618,288" fill="#148BDD"/><polyline points="1160,280 1224,280" fill="none" stroke="#8562D9" stroke-width="3"/><polygon points="1224,280 1210,272 1210,288" fill="#8562D9"/><text x="1168" y="266" font-family="Malgun Gothic,sans-serif" font-size="20" font-weight="400" fill="#8562D9">수집</text><rect x="1232" y="560" width="520" height="240" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="560" width="520" height="60" rx="16" fill="#8562D9" stroke="#8562D9" stroke-width="2"/><text x="1252" y="602" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">04  BeautifulSoup · 링크 추출</text><text x="1252" y="668" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">table.board → td.tit_wrap → a</text><text x="1252" y="707" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">title · href 추출 / 상대경로를 URL로 변환</text><text x="1252" y="746" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">동일 호스트의 HTTP(S) 링크만 최대 10건</text><rect x="640" y="560" width="520" height="240" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="560" width="520" height="60" rx="16" fill="#0FA580" stroke="#0FA580" stroke-width="2"/><text x="660" y="602" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">05  결과 · 오류 캐시 저장</text><text x="660" y="668" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">목록 · 오류 · 출처 · 조회시각 저장</text><text x="660" y="707" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">통신 실패 / 목록 구조·추출 실패 안내</text><text x="660" y="746" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">만료 후 다음 요청에서 다시 수집</text><rect x="48" y="560" width="520" height="240" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="560" width="520" height="60" rx="16" fill="#148BDD" stroke="#148BDD" stroke-width="2"/><text x="68" y="602" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">06  HTML 응답 · 화면 갱신</text><text x="68" y="668" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">정책 목록 또는 오류 안내로 로딩 교체</text><text x="68" y="707" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">HTMX: _list.html / 일반 접속: 전체 화면</text><text x="68" y="746" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">정책 클릭 → 원문을 새 창으로 열기</text><polyline points="1492,420 1492,552" fill="none" stroke="#8562D9" stroke-width="3"/><polygon points="1492,552 1484,538 1500,538" fill="#8562D9"/><polyline points="1232,676 1168,676" fill="none" stroke="#0FA580" stroke-width="3"/><polygon points="1168,676 1182,668 1182,684" fill="#0FA580"/><polyline points="640,676 576,676" fill="none" stroke="#148BDD" stroke-width="3"/><polygon points="576,676 590,668 590,684" fill="#148BDD"/><polyline points="850,420 850,474 308,474 308,552" fill="none" stroke="#0FA580" stroke-width="3"/><polygon points="308,552 300,538 316,538" fill="#0FA580"/><text x="345" y="465" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="700" fill="#0FA580">유효 캐시 → 외부 요청 없이 응답</text><rect x="48" y="866" width="1704" height="258" rx="16" fill="#19324F" stroke="#19324F" stroke-width="2"/><text x="72" y="917" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="white">수집 범위</text><text x="332" y="915" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="white">목록 순서대로 제목·원문 링크를 추출합니다. 정책 본문·첨부파일은 수집하지 않습니다.</text><text x="72" y="975" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="white">오류 대응</text><text x="332" y="973" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="white">통신·추출 실패는 안내 문구로 반환하고, 브라우저 요청 실패도 다이얼로그 안에 표시합니다.</text><text x="72" y="1033" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="white">운영 특성</text><text x="332" y="1030" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="white">CSV 월간 배치와 독립적입니다. 서버 크롤링은 동기 처리이며 예약·백그라운드 수집이 아닙니다.</text><text x="332" y="1078" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#CDDCEF">60초는 실패 캐시 유지시간입니다. 타이머 자동 재시도나 기존 성공 목록 유지 기능은 없습니다.</text></svg>