<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><rect width="1800" height="1000" fill="#F5F8FC"/><text x="48" y="74" font-family="Malgun Gothic,sans-serif" font-size="42" font-weight="700" fill="#19324F">Hi스포링 · 데이터 갱신 및 정제 흐름</text><text x="48" y="120" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="#617792">현재 구현  |  원본 확보는 수동, 서비스 반영은 월간 변경 확인을 거쳐 수행합니다.</text><rect x="48" y="180" width="520" height="220" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="180" width="520" height="60" rx="16" fill="#148BDD" stroke="#148BDD" stroke-width="2"/><text x="68" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">01  원본 CSV 확보 · 반영</text><text x="68" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">운영자가 새 원본을 확보해 data/에 반영</text><text x="68" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">프로그램 · 이용현황 · 시설 · 교통 4종</text><text x="68" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">최신 원본 자동 다운로드는 미구현</text><rect x="640" y="180" width="520" height="220" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="640" y="180" width="520" height="60" rx="16" fill="#8562D9" stroke="#8562D9" stroke-width="2"/><text x="660" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">02  월간 변경 확인</text><text x="660" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">매월 1일 01:00 · Asia/Seoul</text><text x="660" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">원본 버전과 서비스 파일 상태 비교</text><text x="660" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">변경 없음 → 재정제 생략 · 기존 세대 유지</text><rect x="1232" y="180" width="520" height="220" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="180" width="520" height="60" rx="16" fill="#8562D9" stroke="#8562D9" stroke-width="2"/><text x="1252" y="222" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">03  서울 추출 · 검증</text><text x="1252" y="288" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">전국 원본에서 서울 행만 추출</text><text x="1252" y="327" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">지역 코드 · 빈 결과 등 검증</text><text x="1252" y="366" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">임시 .part 파일로 생성</text><polyline points="568,290 632,290" fill="none" stroke="#617792" stroke-width="3"/><polygon points="632,290 618,282 618,298" fill="#617792"/><polyline points="1160,290 1224,290" fill="none" stroke="#617792" stroke-width="3"/><polygon points="1224,290 1210,282 1210,298" fill="#617792"/><rect x="1232" y="490" width="520" height="220" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="490" width="520" height="60" rx="16" fill="#8562D9" stroke="#8562D9" stroke-width="2"/><text x="1252" y="532" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">04  서비스 파일 발행</text><text x="1252" y="598" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">검증 후 서비스 CSV를 파일별 교체</text><text x="1252" y="637" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">data/Batch/에 서울 데이터 반영</text><text x="1252" y="676" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">마지막에 manifest · 세대 정보 발행</text><rect x="640" y="490" width="520" height="220" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="490" width="520" height="60" rx="16" fill="#0FA580" stroke="#0FA580" stroke-width="2"/><text x="660" y="532" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">05  메모리 재적재</text><text x="660" y="598" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">서비스 CSV 세대 변경 감지</text><text x="660" y="637" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">새 데이터 적재 · 파일 상태 검증</text><text x="660" y="676" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">재적재 실패 시 기존 정상 캐시 유지</text><rect x="48" y="490" width="520" height="220" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="490" width="520" height="60" rx="16" fill="#148BDD" stroke="#148BDD" stroke-width="2"/><text x="68" y="532" font-family="Malgun Gothic,sans-serif" font-size="27" font-weight="700" fill="white">06  조회 · AI 분석 근거</text><text x="68" y="598" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">서울 데이터로 목록 조회 · 통계 집계</text><text x="68" y="637" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">지역 현황 · 프로그램 검토 근거 구성</text><text x="68" y="676" font-family="Malgun Gothic,sans-serif" font-size="23" font-weight="400" fill="#19324F">전국 데이터 상시 적재 부담 감소</text><polyline points="1492,400 1492,482" fill="none" stroke="#617792" stroke-width="3"/><polygon points="1492,482 1484,468 1500,468" fill="#617792"/><polyline points="1232,600 1168,600" fill="none" stroke="#617792" stroke-width="3"/><polygon points="1168,600 1182,592 1182,608" fill="#617792"/><polyline points="640,600 576,600" fill="none" stroke="#617792" stroke-width="3"/><polygon points="576,600 590,592 590,608" fill="#617792"/><rect x="48" y="770" width="1704" height="166" rx="16" fill="#19324F" stroke="#19324F" stroke-width="2"/><text x="72" y="819" font-family="Malgun Gothic,sans-serif" font-size="26" font-weight="700" fill="white">누락·실패 대응</text><text x="330" y="817" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="white">원본 누락 → 실행 실패 · 다이얼로그에 누락 파일과 복구 안내</text><text x="330" y="862" font-family="Malgun Gothic,sans-serif" font-size="24" font-weight="400" fill="white">추출·검증 실패 → 임시 파일 정리 · 오류 기록 · 교체 전 기존 서비스 파일 유지</text><text x="72" y="909" font-family="Malgun Gothic,sans-serif" font-size="22" font-weight="400" fill="#CDDCEF">운영 한계: 서버 중지 중 예약 실행 및 여러 CSV 전체의 일괄 롤백은 보장하지 않습니다.</text></svg>