<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#19324F"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#148BDD"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0FA580"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8562D9"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#DB8121"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#617792"/></marker></defs><rect width="1800" height="1000" fill="#F5F8FC"/><g font-family="Malgun Gothic, sans-serif"><text x="48" y="70" font-size="44" fill="#19324F" font-weight="700">스포링 · AI 공급자 교체 구조</text><text x="48" y="118" font-size="25" fill="#617792" font-weight="400">공통 요청·응답 계약을 유지하고 공급자별 SDK와 오류 처리를 어댑터로 분리</text><rect x="48" y="185" width="520" height="270" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="48" y="185" width="520" height="62" rx="15" fill="#0FA580"/><text x="72" y="227" font-size="28" fill="white" font-weight="700">01  업무 서비스·AIRequest</text><text x="72" y="291" font-size="25" fill="#19324F" font-weight="400">지역 분석 / 프로그램 검토</text><text x="72" y="333" font-size="25" fill="#19324F" font-weight="400">분석 지침·집계 근거·입력 계획 구성</text><text x="72" y="375" font-size="25" fill="#19324F" font-weight="400">응답 스키마와 요청 ID 전달</text><text x="72" y="417" font-size="25" fill="#19324F" font-weight="400">원본 CSV 전체 업로드·학습 없음</text><rect x="640" y="185" width="520" height="270" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="185" width="520" height="62" rx="15" fill="#0FA580"/><text x="664" y="227" font-size="28" fill="white" font-weight="700">02  팩토리·공통 인터페이스</text><text x="664" y="291" font-size="25" fill="#19324F" font-weight="400">모드·공급자·모델 설정 확인</text><text x="664" y="333" font-size="25" fill="#19324F" font-weight="400">factory.create_provider()</text><text x="664" y="375" font-size="25" fill="#19324F" font-weight="400">AIProvider.generate(request)</text><text x="664" y="417" font-size="25" fill="#19324F" font-weight="400">선택한 공급자의 SDK만 로딩</text><rect x="1232" y="185" width="520" height="270" rx="16" fill="white" stroke="#DB8121" stroke-width="2"/><rect x="1232" y="185" width="520" height="62" rx="15" fill="#DB8121"/><text x="1256" y="227" font-size="28" fill="white" font-weight="700">03  현재 구현된 공급자</text><text x="1256" y="291" font-size="25" fill="#19324F" font-weight="400">GeminiProvider: google-genai 호출</text><text x="1256" y="333" font-size="25" fill="#19324F" font-weight="400">DummyProvider: 외부 호출 없는 예시</text><text x="1256" y="375" font-size="25" fill="#19324F" font-weight="400">공급자 오류를 공통 오류 코드로 변환</text><text x="1256" y="417" font-size="25" fill="#19324F" font-weight="400">재시도는 공급자 어댑터에서 처리</text><path d="M568 320H630" fill="none" stroke="#0FA580" stroke-width="3" marker-end="url(#green)"/><path d="M1160 320H1222" fill="none" stroke="#DB8121" stroke-width="3" marker-end="url(#orange)"/><rect x="1232" y="565" width="520" height="245" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="1232" y="565" width="520" height="62" rx="15" fill="#0FA580"/><text x="1256" y="607" font-size="28" fill="white" font-weight="700">04  AIResponse·공통 검증</text><text x="1256" y="671" font-size="25" fill="#19324F" font-weight="400">data / provider / model 반환</text><text x="1256" y="713" font-size="25" fill="#19324F" font-weight="400">JSON 구조·근거 키·점수 검증</text><text x="1256" y="755" font-size="25" fill="#19324F" font-weight="400">검증된 결과만 업무 서비스에 전달</text><rect x="640" y="565" width="520" height="245" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="640" y="565" width="520" height="62" rx="15" fill="#8562D9"/><text x="664" y="607" font-size="28" fill="white" font-weight="700">05  결과 반영·보관</text><text x="664" y="671" font-size="25" fill="#19324F" font-weight="400">지역 분석: 공급자별 파일 캐시</text><text x="664" y="713" font-size="25" fill="#19324F" font-weight="400">프로그램 검토: 입력 연결 서명 토큰</text><text x="664" y="755" font-size="25" fill="#19324F" font-weight="400">완성 계획서: 생성 당시 결과 유지</text><rect x="48" y="565" width="520" height="245" rx="16" fill="white" stroke="#DB8121" stroke-width="2"/><rect x="48" y="565" width="520" height="62" rx="15" fill="#DB8121"/><text x="72" y="607" font-size="28" fill="white" font-weight="700">확장 지점 · GPT / Claude</text><text x="72" y="671" font-size="25" fill="#19324F" font-weight="400">전용 어댑터 구현 + 팩토리 등록 필요</text><text x="72" y="713" font-size="25" fill="#19324F" font-weight="400">공통 요청·응답·오류 규약 준수</text><text x="72" y="755" font-size="25" fill="#19324F" font-weight="400">미구현 공급자 설정만으로 호출 불가</text><path d="M1492 455V553" fill="none" stroke="#0FA580" stroke-width="3" marker-end="url(#green)"/><path d="M1232 680H1172" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><rect x="48" y="882" width="1704" height="76" rx="14" fill="#19324F"/><text x="70" y="930" font-size="26" fill="white" font-weight="700">공급자 확장 범위</text><text x="330" y="930" font-size="24" fill="white" font-weight="400">Gemini·더미를 구현했습니다. 장애 시 다른 공급자로 자동 전환하지 않습니다.</text></g></svg>