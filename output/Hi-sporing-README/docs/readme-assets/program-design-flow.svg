<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#19324F"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#148BDD"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0FA580"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8562D9"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#DB8121"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#617792"/></marker></defs><rect width="1800" height="1000" fill="#F5F8FC"/><g font-family="Malgun Gothic, sans-serif"><text x="48" y="70" font-size="44" fill="#19324F" font-weight="700">스포링 · 프로그램 설계 흐름</text><text x="48" y="118" font-size="25" fill="#617792" font-weight="400">지역 현황 확인부터 종목·시설 선택, AI 검토와 계획서 완성까지</text><rect x="48" y="185" width="520" height="250" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="185" width="520" height="62" rx="15" fill="#148BDD"/><text x="72" y="227" font-size="28" fill="white" font-weight="700">01  지역 선택·조회</text><text x="72" y="291" font-size="25" fill="#19324F" font-weight="400">지도·행정구역에서 지역 조회</text><text x="72" y="333" font-size="25" fill="#19324F" font-weight="400">시설·강좌·신청 실적 확인</text><text x="72" y="375" font-size="25" fill="#19324F" font-weight="400">지역 AI 분석은 버튼 클릭 시 선택 실행</text><rect x="640" y="185" width="520" height="250" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="640" y="185" width="520" height="62" rx="15" fill="#148BDD"/><text x="664" y="227" font-size="28" fill="white" font-weight="700">02  종목·시설 선택</text><text x="664" y="291" font-size="25" fill="#19324F" font-weight="400">종목에 맞는 정상운영 후보 조회</text><text x="664" y="333" font-size="25" fill="#19324F" font-weight="400">시설 상세·교통 확인, 최대 20곳 선택</text><text x="664" y="375" font-size="25" fill="#19324F" font-weight="400">후보가 없을 때만 동의 후 시설 미정</text><rect x="1232" y="185" width="520" height="250" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="1232" y="185" width="520" height="62" rx="15" fill="#148BDD"/><text x="1256" y="227" font-size="28" fill="white" font-weight="700">03  프로그램 정보 입력</text><text x="1256" y="291" font-size="25" fill="#19324F" font-weight="400">프로그램명·대상·기간·내용 입력</text><text x="1256" y="333" font-size="25" fill="#19324F" font-weight="400">시설별 모집인원·수강료 입력</text><text x="1256" y="375" font-size="25" fill="#19324F" font-weight="400">현재 입력으로 AI 분석 여부 선택</text><path d="M568 305H630" fill="none" stroke="#148BDD" stroke-width="3" marker-end="url(#blue)"/><path d="M1160 305H1222" fill="none" stroke="#148BDD" stroke-width="3" marker-end="url(#blue)"/><rect x="1232" y="550" width="520" height="260" rx="16" fill="white" stroke="#DB8121" stroke-width="2"/><rect x="1232" y="550" width="520" height="62" rx="15" fill="#DB8121"/><text x="1256" y="592" font-size="28" fill="white" font-weight="700">04  AI 검토 또는 생략</text><text x="1256" y="656" font-size="25" fill="#19324F" font-weight="400">AI 검토: 의견 확인·포함 여부 선택</text><text x="1256" y="698" font-size="25" fill="#19324F" font-weight="400">AI 미사용: AI 없이 생성하기 선택</text><text x="1256" y="740" font-size="25" fill="#19324F" font-weight="400">동일 입력의 유효 결과는 재분석 제한</text><text x="1256" y="782" font-size="25" fill="#19324F" font-weight="400">입력 변경 시 재검토 또는 AI 생략</text><rect x="640" y="550" width="520" height="260" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="550" width="520" height="62" rx="15" fill="#0FA580"/><text x="664" y="592" font-size="28" fill="white" font-weight="700">05  계획서 완성</text><text x="664" y="656" font-size="25" fill="#19324F" font-weight="400">현재 입력·선택 시설·검토 토큰 검증</text><text x="664" y="698" font-size="25" fill="#19324F" font-weight="400">선택한 유효 AI 의견만 계획서에 반영</text><text x="664" y="740" font-size="25" fill="#19324F" font-weight="400">생성 후에도 STEP 03과 입력값 유지</text><text x="664" y="782" font-size="25" fill="#19324F" font-weight="400">생성 과정에서 AI를 다시 호출하지 않음</text><rect x="48" y="550" width="520" height="260" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="48" y="550" width="520" height="62" rx="15" fill="#8562D9"/><text x="72" y="592" font-size="28" fill="white" font-weight="700">06  인쇄·최근 목록</text><text x="72" y="656" font-size="25" fill="#19324F" font-weight="400">이미지 준비 후 계획서 인쇄</text><text x="72" y="698" font-size="25" fill="#19324F" font-weight="400">생성 당시 결과를 브라우저 5건 보관</text><text x="72" y="740" font-size="25" fill="#19324F" font-weight="400">최근 항목 복원 시 서명 확인</text><text x="72" y="782" font-size="25" fill="#19324F" font-weight="400">처음으로: 입력·AI 화면 초기화</text><path d="M1492 435V538" fill="none" stroke="#DB8121" stroke-width="3" marker-end="url(#orange)"/><path d="M1232 680H1172" fill="none" stroke="#0FA580" stroke-width="3" marker-end="url(#green)"/><path d="M640 680H580" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><rect x="48" y="882" width="1704" height="76" rx="14" fill="#19324F"/><text x="70" y="930" font-size="26" fill="white" font-weight="700">사용자 결정 유지</text><text x="330" y="930" font-size="24" fill="white" font-weight="400">AI 의견은 참고 자료입니다. 최종 프로그램 기획과 운영 판단은 담당자가 수행합니다.</text></g></svg>