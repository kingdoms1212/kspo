0" y="185" width="520" height="62" rx="15" fill="#8562D9"/><text x="664" y="227" font-size="28" fill="white" font-weight="700">02  지역 정제·준비본</text><text x="664" y="291" font-size="25" fill="#19324F" font-weight="400">실행 잠금으로 중복 배치 제한</text><text x="664" y="333" font-size="25" fill="#19324F" font-weight="400">서울 추출·지역 코드 품질 검사</text><text x="664" y="375" font-size="25" fill="#19324F" font-weight="400">잘못된 행 제외·사유별 건수 기록</text><text x="664" y="417" font-size="25" fill="#19324F" font-weight="400">.part 파일 작성 후 flush·fsync</text><rect x="1232" y="185" width="520" height="265" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="185" width="520" height="62" rx="15" fill="#8562D9"/><text x="1256" y="227" font-size="28" fill="white" font-weight="700">03  검증·서비스 CSV 게시</text><text x="1256" y="291" font-size="25" fill="#19324F" font-weight="400">대상 지역·0건·준비본 검증</text><text x="1256" y="333" font-size="25" fill="#19324F" font-weight="400">검증 후 파일별 최종 CSV 교체</text><text x="1256" y="375" font-size="25" fill="#19324F" font-weight="400">data/Batch/ 서비스 파일 반영</text><text x="1256" y="417" font-size="25" fill="#19324F" font-weight="400">전체 파일 일괄 트랜잭션은 아님</text><path d="M568 315H630" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><path d="M1160 315H1222" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><rect x="1232" y="565" width="520" height="245" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="1232" y="565" width="520" height="62" rx="15" fill="#8562D9"/><text x="1256" y="607" font-size="28" fill="white" font-weight="700">04  manifest 발행</text><text x="1256" y="671" font-size="25" fill="#19324F" font-weight="400">파일 교체 후 마지막에 발행</text><text x="1256" y="713" font-size="25" fill="#19324F" font-weight="400">generation / 크기 / 수정시각</text><text x="1256" y="755" font-size="25" fill="#19324F" font-weight="400">SHA-256·행 수·제외 건수 기록</text><rect x="640" y="565" width="520" height="245" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="565" width="520" height="62" rx="15" fill="#0FA580"/><text x="664" y="607" font-size="28" fill="white" font-weight="700">05  runtime 적재·갱신</text><text x="664" y="671" font-size="25" fill="#19324F" font-weight="400">워커 초기화 뒤 최초 사전 적재</text><text x="664" y="713" font-size="25" fill="#19324F" font-weight="400">세대 변경 감지 후 새 데이터 적재</text><text x="664" y="755" font-size="25" fill="#19324F" font-weight="400">적재 전후 세대·파일 서명 확인</text><rect x="48" y="565" width="520" height="245" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="565" width="520" height="62" rx="15" fill="#148BDD"/><text x="72" y="607" font-size="28" fill="white" font-weight="700">06  메모리 스냅샷 조회</text><text x="72" y="671" font-size="25" fill="#19324F" font-weight="400">적재 완료된 스냅샷으로 교체</text><text x="72" y="713" font-size="25" fill="#19324F" font-weight="400">정상 캐시가 있으면 갱신 중 조회 유지</text><text x="72" y="755" font-size="25" fill="#19324F" font-weight="400">재적재 실패 시 기존 정상 캐시 유지</text><path d="M1492 450V553" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><path d="M1232 680H1172" fill="none" stroke="#0FA580" stroke-width="3" marker-end="url(#green)"/><path d="M640 680H580" fill="none" stroke="#148BDD" stroke-width="3" marker-end="url(#blue)"/><rect x="48" y="882" width="1704" height="76" rx="14" fill="#19324F"/><text x="70" y="930" font-size="26" fill="white" font-weight="700">운영 전제</text><text x="330" y="930" font-size="24" fill="white" font-weight="400">서버 중지 중 예약 실행은 보장하지 않습니다. 최초 적재 실패 시 유지할 기존 캐시는 없습니다.</text></g></svg>