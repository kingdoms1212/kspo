<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000"><defs><marker id="navy" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#19324F"/></marker><marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#148BDD"/></marker><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#0FA580"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8562D9"/></marker><marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#DB8121"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#617792"/></marker></defs><rect width="1800" height="1000" fill="#F5F8FC"/><g font-family="Malgun Gothic, sans-serif"><text x="48" y="70" font-size="44" fill="#19324F" font-weight="700">스포링 · AI 연동 구조</text><text x="48" y="118" font-size="25" fill="#617792" font-weight="400">사용자 분석 요청 → 근거 구성 → Gemini 호출 → 검증된 의견을 화면과 계획서에 반영</text><rect x="48" y="185" width="520" height="270" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="185" width="520" height="62" rx="15" fill="#148BDD"/><text x="72" y="227" font-size="28" fill="white" font-weight="700">01  사용자 분석 요청</text><text x="72" y="291" font-size="25" fill="#19324F" font-weight="400">지역 현황: AI로 분석하기</text><text x="72" y="333" font-size="25" fill="#19324F" font-weight="400">STEP 03: 프로그램 AI 검토</text><text x="72" y="375" font-size="25" fill="#19324F" font-weight="400">분석 중 로딩·중복 클릭 제한</text><text x="72" y="417" font-size="25" fill="#19324F" font-weight="400">조회만으로 AI를 호출하지 않음</text><rect x="640" y="185" width="520" height="270" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="640" y="185" width="520" height="62" rx="15" fill="#0FA580"/><text x="664" y="227" font-size="28" fill="white" font-weight="700">02  서버의 분석 근거 구성</text><text x="664" y="291" font-size="25" fill="#19324F" font-weight="400">지역 집계·종목 분포·자료 기간</text><text x="664" y="333" font-size="25" fill="#19324F" font-weight="400">프로그램 검토: 선택 시설·입력 계획</text><text x="664" y="375" font-size="25" fill="#19324F" font-weight="400">분석 지침·JSON 응답 스키마 준비</text><text x="664" y="417" font-size="25" fill="#19324F" font-weight="400">유효한 지역 캐시가 있으면 재사용</text><rect x="1232" y="185" width="520" height="270" rx="16" fill="white" stroke="#DB8121" stroke-width="2"/><rect x="1232" y="185" width="520" height="62" rx="15" fill="#DB8121"/><text x="1256" y="227" font-size="28" fill="white" font-weight="700">03  Gemini API 호출</text><text x="1256" y="291" font-size="25" fill="#19324F" font-weight="400">서버에서 google-genai SDK 사용</text><text x="1256" y="333" font-size="25" fill="#19324F" font-weight="400">API 키는 서버 환경변수로 관리</text><text x="1256" y="375" font-size="25" fill="#19324F" font-weight="400">지침·근거·스키마를 요청으로 전달</text><text x="1256" y="417" font-size="25" fill="#19324F" font-weight="400">일시적 오류만 제한적으로 재시도</text><path d="M568 320H630" fill="none" stroke="#148BDD" stroke-width="3" marker-end="url(#blue)"/><path d="M1160 320H1222" fill="none" stroke="#DB8121" stroke-width="3" marker-end="url(#orange)"/><rect x="1232" y="565" width="520" height="245" rx="16" fill="white" stroke="#0FA580" stroke-width="2"/><rect x="1232" y="565" width="520" height="62" rx="15" fill="#0FA580"/><text x="1256" y="607" font-size="28" fill="white" font-weight="700">04  응답 검증·결과 계산</text><text x="1256" y="671" font-size="25" fill="#19324F" font-weight="400">JSON 구조·근거 키·점수 검사</text><text x="1256" y="713" font-size="25" fill="#19324F" font-weight="400">프로그램 종합 점수·등급 계산</text><text x="1256" y="755" font-size="25" fill="#19324F" font-weight="400">검증 실패 시 분석 실패 안내</text><rect x="640" y="565" width="520" height="245" rx="16" fill="white" stroke="#8562D9" stroke-width="2"/><rect x="640" y="565" width="520" height="62" rx="15" fill="#8562D9"/><text x="664" y="607" font-size="28" fill="white" font-weight="700">05  검증 결과 보관</text><text x="664" y="671" font-size="25" fill="#19324F" font-weight="400">지역 요약: 파일 캐시 24시간</text><text x="664" y="713" font-size="25" fill="#19324F" font-weight="400">프로그램 검토: 서명 토큰 1시간</text><text x="664" y="755" font-size="25" fill="#19324F" font-weight="400">입력·선택 시설과 결과 일치 검사</text><rect x="48" y="565" width="520" height="245" rx="16" fill="white" stroke="#148BDD" stroke-width="2"/><rect x="48" y="565" width="520" height="62" rx="15" fill="#148BDD"/><text x="72" y="607" font-size="28" fill="white" font-weight="700">06  화면·계획서 반영</text><text x="72" y="671" font-size="25" fill="#19324F" font-weight="400">지역 해석·프로그램 검토 결과 표시</text><text x="72" y="713" font-size="25" fill="#19324F" font-weight="400">선택한 유효 검토만 계획서에 포함</text><text x="72" y="755" font-size="25" fill="#19324F" font-weight="400">생성·인쇄·복원 시 AI 재호출 없음</text><path d="M1492 455V553" fill="none" stroke="#0FA580" stroke-width="3" marker-end="url(#green)"/><path d="M1232 680H1172" fill="none" stroke="#8562D9" stroke-width="3" marker-end="url(#purple)"/><path d="M640 680H580" fill="none" stroke="#148BDD" stroke-width="3" marker-end="url(#blue)"/><rect x="48" y="882" width="1704" height="76" rx="14" fill="#19324F"/><text x="70" y="930" font-size="26" fill="white" font-weight="700">분석 범위</text><text x="330" y="930" font-size="24" fill="white" font-weight="400">집계·선택 정보로 참고 의견을 제공합니다. 원본 CSV 전체 업로드나 사전 학습은 하지 않습니다.</text></g></svg>