{% extends 'base.html' %}
{% load static %}
{% block content %}
<section class="page-head">
  <div class="heading-copy" id="dashboard-heading"><h1>{% if selected_region %}{{ selected_region }}{% else %}전국{% endif %} 시설 이용현황</h1><p>스포츠강좌이용권 이용현황 자료에서 시설·강좌·신청인원을 확인합니다.</p></div>
  <form class="inline-filters" method="get" hx-get="{% url 'dashboard' %}" hx-target="#dashboard-body" hx-swap="innerHTML show:none" hx-push-url="true" hx-indicator="#dashboard-busy">
    <label class="sr-only" for="dashboard-region">조회 지역</label>
    <select id="dashboard-region" name="region" hx-trigger="change" hx-get="{% url 'dashboard' %}" hx-target="#dashboard-body" hx-swap="innerHTML show:none" hx-push-url="true" hx-indicator="#dashboard-busy"><option value="">전국</option>{% for option in region_options %}<option {% if option == selected_region %}selected{% endif %}>{{ option }}</option>{% endfor %}</select>
    <button class="button primary" type="submit">조회</button>
    {% include 'components/busy.html' with id='dashboard-busy' %}
  </form>
</section>
<div id="dashboard-body">{% include 'dashboard/_body.html' %}</div>
<script src="{% static 'region-map.js' %}?v=20260915-map-fix" defer></script>
<script>
  // A province on the map narrows the dashboard the same way the picker does.
  document.addEventListener('regionmap:select', (event) => {
    if (event.detail.level !== 'region') return;
    const select = document.getElementById('dashboard-region');
    const match = select && Array.from(select.options)
      .find((option) => window.SportInsightRegionMap.shortName(option.value) === event.detail.shortName);
    if (!match) return;
    select.value = match.value;
    select.dispatchEvent(new Event('change'));
  });
</script>
{% endblock %}
