{% load static %}
<section id="program-planner" class="planner panel" aria-label="프로그램 설계 입력" data-list-url="{% url 'plan_facilities' %}" data-detail-url="{% url 'plan_facility_detail' %}" data-preview-url="{% url 'plan_preview' %}" data-restore-url="{% url 'plan_restore' %}" hidden>
  <p id="plan-status" class="sr-only" role="status" aria-live="polite"></p>
  <p id="plan-error" class="plan-error" role="alert" tabindex="-1"></p>
  <div id="plan-selection" hidden>
    <div class="plan-search-row">
    <label class="plan-field"><span class="sr-only">종목 선택</span><select id="plan-sport"><option value="">종목 선택</option>{% for sport in planning_sports %}<option>{{ sport }}</option>{% endfor %}</select></label>
    <form id="plan-search" class="plan-search"><label for="plan-query" class="sr-only">시설명 또는 주소 검색</label><input id="plan-query" maxlength="100" placeholder="시설명 또는 주소"><button class="button ghost" type="submit">시설 검색</button></form>
    </div>
    <div class="plan-facility-workspace">
    <div id="plan-loading" class="app-splash plan-loading" hidden>
      <div class="app-splash-inner">
        <img src="{% static 'image/logo/logo.png' %}" alt="" width="946" height="122">
        <p class="app-splash-text" role="status">선택한 종목의 시설을 불러오는 중입니다. 잠시만 기다려 주세요.</p>
        <span class="app-splash-bar" aria-hidden="true"><i></i></span>
      </div>
    </div>
    <div class="plan-detail-content">
    <div id="plan-facility-grid" class="plan-facility-grid" aria-busy="false">
      <section id="plan-candidates-section" aria-labelledby="plan-candidates-heading">
        <div class="section-title plan-candidates-title"><h3 id="plan-candidates-heading">설계 후보 시설 <span id="plan-count" class="count"></span></h3><span id="plan-selected-count">선택 0곳 / 최대 20곳</span></div>
        <div id="plan-candidates" class="plan-candidates"></div>
        <div id="plan-pagination" class="plan-pagination" hidden><button id="plan-prev" type="button" class="button ghost">이전</button><span id="plan-page"></span><button id="plan-next" type="button" class="button ghost">다음</button></div>
      </section>
      <aside id="plan-detail" class="plan-detail" aria-label="선택한 시설 상세" tabindex="-1"><div class="plan-detail-content"></div></aside>
    </div>
      <!-- [SH260917] 매칭 후보 시설이 없을 때만 동의 후 시설 미정으로 진행합니다. -->
      <label id="plan-without-facility" class="plan-without-facility" hidden><input id="plan-without-facility-check" type="checkbox">매칭되는 시설이 없어도 시설 미정으로 진행하겠습니다.</label>
    </div>
    </div>
  </div>
  <div id="plan-entry" hidden>
    <div class="plan-info-heading"><h2>프로그램 정보 입력</h2></div><form id="plan-form">{% csrf_token %}<div class="plan-fields">
      <label class="plan-field plan-wide">프로그램명<input name="name" required maxlength="100" placeholder="예: 우리 동네 청소년 농구 교실"></label>
      <label class="plan-field">시설별 모집인원 (명)<input name="capacity" type="number" required min="1" max="100000" step="1" inputmode="numeric"></label>
      <label class="plan-field">1인 수강료 (원)<input name="fee" type="number" required min="0" max="100000000" step="1" inputmode="numeric" placeholder="무료는 0"></label>
      <label class="plan-field">수강료 기준<select name="fee_unit"><option value="월">월 기준</option><option value="회">1회 기준</option><option value="과정">전체 과정 기준</option></select></label>
      <label class="plan-field">대상<input name="target" maxlength="100" placeholder="예: 초등학교 4~6학년"></label><label class="plan-field">운영 시작일<input id="plan-date-start" name="start" type="date"></label><label class="plan-field">운영 종료일<input id="plan-date-end" name="end" type="date"></label>
      <label class="plan-field plan-wide">프로그램 설명<textarea name="description" required maxlength="2000" rows="4" placeholder="참여 대상, 운영 내용, 일정 등을 입력하세요."></textarea></label>
      <div class="plan-wide plan-ai-option"><label><input type="checkbox" name="ai_review" aria-describedby="plan-ai-help"> AI 검토 포함 <span class="chart-note">데모</span></label><p id="plan-ai-help" class="chart-note">Gemini 연동 전 미리보기 기능입니다. 예시 의견이 보고서에 포함되며 외부로 데이터를 전송하지 않습니다.</p></div>
    </div></form>
  </div>
</section>
<div id="plan-entry-actions" class="plan-step-actions plan-entry-actions" hidden>
  <button class="button ghost" id="plan-back-selection" type="button">이전 단계</button>
  <button class="button primary" id="plan-generate" type="submit" form="plan-form">계획서 완성하기</button>
</div>
<div id="plan-step-actions" class="plan-step-actions" hidden>
  <button type="button" class="button ghost" id="plan-back-region">이전 단계</button>
  <button type="button" class="button primary" id="plan-confirm" disabled>다음 단계</button>
</div>
<dialog id="plan-result" class="plan-result" aria-labelledby="plan-result-title">
  <div class="plan-result-head"><span class="plan-pill">검토용 계획서 · 생성 당시 자료 기준</span><button type="button" class="policy-close" id="plan-close-top" aria-label="계획서 닫기"><span aria-hidden="true">×</span></button></div>
  <div id="plan-result-content"></div>
  <p id="plan-share-status" role="status"></p>
  <div class="plan-result-actions"><button type="button" class="button primary" id="plan-print">{% include 'components/icon.html' with name='print' %}프린트</button><button type="button" class="button ghost" id="plan-sms">{% include 'components/icon.html' with name='message' %}문자보내기</button><button type="button" class="button ghost" id="plan-kakao">{% include 'components/icon.html' with name='kakao' %}카카오톡 보내기</button><button type="button" class="button ghost" id="plan-close">닫기</button></div>
</dialog>
<div id="plan-print-area" class="plan-print-area" aria-hidden="true"></div>
<dialog id="plan-share-dialog" class="plan-result" aria-labelledby="plan-share-title"><div class="planner-heading"><h2 id="plan-share-title">공유 내용 확인</h2><button id="plan-share-close" class="button ghost" type="button">공유 닫기</button></div><div class="plan-share-body"><label id="plan-recipient-label" class="plan-field">받는 사람 연락처<input id="plan-recipient" type="tel" placeholder="010-0000-0000" autocomplete="off"></label><label class="plan-field">전달 내용<textarea id="plan-share-message" rows="9" readonly></textarea></label><p id="plan-share-help" class="chart-note"></p><button class="button primary" type="button" disabled>외부 서비스 연동 후 발송 가능</button></div></dialog>
