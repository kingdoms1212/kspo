<style>
  .dashboard-screen .db-heading{justify-content:flex-start;gap:10px;position:relative}
  .dashboard-screen .db-layout{display:grid;grid-template-columns:minmax(250px,30%) minmax(0,1fr);gap:16px;align-items:stretch}
  .dashboard-screen .db-right{display:grid;gap:16px;min-width:0}
  .dashboard-screen .db-section-title{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .dashboard-screen .db-section-title h2{font-size:15px;margin:0;color:var(--si-heading)}
  .dashboard-screen select{max-width:100%;min-height:34px;padding:5px 9px;border:1px solid var(--si-border-control);border-radius:5px;background:var(--si-surface);color:var(--si-text);font:inherit}
  .dashboard-screen .db-metric{display:grid;grid-template-columns:48px minmax(0,1fr);column-gap:12px;align-items:center;position:relative;padding:15px 12px;border:1px solid var(--si-border);border-radius:6px;background:var(--si-surface)}
  .dashboard-screen .db-metric-label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--si-heading);flex-wrap:wrap}
  .dashboard-screen .db-metric>strong{grid-column:2;display:block;margin-top:12px;font-size:clamp(19px,1.65vw,28px);font-variant-numeric:tabular-nums;color:var(--si-heading);letter-spacing:-.04em;overflow-wrap:anywhere}
  .dashboard-screen em{font-style:normal;font-size:12px;font-weight:400;letter-spacing:0}
  .dashboard-screen .db-charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .dashboard-screen .db-chart-panel,.dashboard-screen .db-policy{position:relative;min-width:0}
  .dashboard-screen .db-chart-scroll{height:370px;overflow-y:scroll;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--si-border-control) var(--si-bg)}
  .dashboard-screen .db-chart-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
  .dashboard-screen .db-chart-table th{width:100px;text-align:left;font-weight:600;overflow-wrap:anywhere}
  .dashboard-screen .db-chart-table td,.dashboard-screen .db-chart-table th{padding:10px 0;border-bottom:1px solid var(--si-chart-grid);vertical-align:middle}
  .dashboard-screen .db-chart-table small{display:block;font-size:11px;font-weight:400;color:var(--si-text-muted);line-height:1.5;margin-top:4px}
  .dashboard-screen .db-chart-table .db-bar-cell{padding-left:6px;padding-right:8px}
  .dashboard-screen .db-chart-table .db-chart-value{width:76px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;padding-right:4px}
  .dashboard-screen .db-bar-track{height:22px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(25% - 1px),var(--si-chart-grid) calc(25% - 1px),var(--si-chart-grid) 25%)}
  .dashboard-screen .db-bar{height:100%;display:block;background:linear-gradient(90deg,var(--si-chart-comparison),var(--si-chart-primary));border-radius:0 2px 2px 0}
  .dashboard-screen .db-bar-min{min-width:2px}
  .dashboard-screen .db-policy-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .dashboard-screen .db-policy-grid>div{background:var(--si-surface-hover);border:1px solid var(--si-border);border-radius:5px;padding:12px 10px}
  .dashboard-screen .db-policy-grid span{font-size:12px;color:var(--si-text-muted)}
  .dashboard-screen .db-policy-grid strong{display:block;font-size:20px;color:var(--si-heading);margin-top:8px;font-variant-numeric:tabular-nums}
  @media(max-width:1250px){.dashboard-screen .db-layout{grid-template-columns:minmax(220px,29%) minmax(0,1fr)}.dashboard-screen .db-chart-table th{width:79px}}
  @media(max-width:1050px){.dashboard-screen .db-layout{grid-template-columns:1fr}}
  @media(max-width:650px){.dashboard-screen .db-charts{grid-template-columns:1fr}.dashboard-screen .db-policy-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.dashboard-screen .db-chart-table th{width:100px}.dashboard-screen .db-chart-scroll{height:330px}}
  .dashboard-screen .db-metric>.metric-icon{grid-row:1 / 3;width:48px;height:48px;margin:0}
  .dashboard-screen .db-metric:nth-child(2)>.metric-icon,.dashboard-screen .db-metric:nth-child(3)>.metric-icon{color:var(--si-success);background:var(--si-success-bg)}
  .dashboard-screen .db-chart-heading{gap:6px;flex-wrap:wrap}
  .dashboard-screen .db-chart-heading h2{font-size:15px}
  .dashboard-screen .db-sort-toggle{display:inline-flex;gap:1px;align-items:center;justify-content:center;min-width:34px;min-height:34px;margin-left:auto;border:1px solid var(--si-border-control);border-radius:5px;text-decoration:none;background:var(--si-surface);font-size:20px}
  .dashboard-screen .db-sort-toggle span{color:var(--si-text-muted)}
  .dashboard-screen .db-sort-toggle .active{color:var(--si-primary);font-weight:800}
  .dashboard-screen .db-chart-table tbody tr{display:grid;grid-template-columns:minmax(0,1fr) 86px;column-gap:7px;padding:12px 0;border-bottom:1px solid var(--si-chart-grid)}
  .dashboard-screen .db-chart-table tbody th{grid-column:1 / -1;width:auto;padding:0 0 8px;border:0}
  .dashboard-screen .db-chart-table .db-province{display:inline;font-size:11px;font-weight:400;color:var(--si-text-muted);margin-left:6px}
  .dashboard-screen .db-chart-table small{white-space:nowrap}
  .dashboard-screen .db-chart-table .db-bar-cell{padding:0;border:0;align-self:center}
  .dashboard-screen .db-chart-table .db-chart-value{width:auto;padding:0 4px 0 0;border:0;align-self:center}
  .dashboard-screen .db-chart-table .empty{grid-column:1 / -1;border:0}
  .dashboard-screen .db-policy-label{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .dashboard-screen .db-policy-label .icon{width:20px;height:20px;color:var(--si-primary);flex-shrink:0}
  @media(max-width:650px){.dashboard-screen .db-sort-toggle{min-width:44px;min-height:44px}}
  .dashboard-screen .db-metrics{margin-bottom:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .dashboard-screen #dashboard-region-map{height:380px}
  .dashboard-screen .map-panel>.section-title{position:relative;justify-content:flex-start;gap:8px}
  .dashboard-screen .db-helper{margin-left:auto;display:flex}
  .dashboard-screen .heading-help{position:static}
  .dashboard-screen .heading-tooltip{left:10px;top:48px;transform:translateY(-4px);max-width:calc(100% - 20px)}
  .dashboard-screen .heading-tooltip:before{display:none}
  .dashboard-screen .heading-help:hover .heading-tooltip,.dashboard-screen .heading-help:focus .heading-tooltip{transform:translateY(0)}
  .dashboard-screen .db-chart-modes{display:flex;justify-content:flex-end;gap:5px}
  .dashboard-screen .db-chart-modes a{padding:6px 15px;border:1px solid var(--si-border-control);border-radius:5px;text-decoration:none;color:var(--si-text);background:var(--si-surface)}
  .dashboard-screen .db-chart-modes a[aria-current]{color:var(--si-text-inverse);background:var(--si-primary);border-color:var(--si-primary)}
  .dashboard-screen .db-pie{width:180px;aspect-ratio:1;border-radius:50%;margin:12px auto}
  .dashboard-screen .db-pie-note{font-size:11px;text-align:center;color:var(--si-text-muted)}
  .dashboard-screen .db-pie-legend{list-style:none;margin:0;padding:0;max-height:230px;overflow-y:auto;scrollbar-width:thin}
  .dashboard-screen .db-pie-legend li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:7px;align-items:center;padding:10px 0;border-bottom:1px solid var(--si-border);font-size:12px}
  .dashboard-screen .db-pie-key{width:10px;height:10px;border-radius:50%}
  .dashboard-screen .db-pie-legend small{display:block;font-size:11px;color:var(--si-text-muted);font-weight:400}
  .dashboard-screen .db-pie-value{text-align:right;font-variant-numeric:tabular-nums}
  .dashboard-screen .db-pie-legend .db-province{margin-left:5px;font-size:11px;color:var(--si-text-muted)}
</style>
