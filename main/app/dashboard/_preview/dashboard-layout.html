<div id="si-dashboard-preview" aria-label="시설 이용 현황 배치 시안">
  <style>
    #si-dashboard-preview{--si-bg:#f3f7fc;--si-panel:#fff;--si-ink:#103466;--si-muted:#617895;--si-line:#dce7f4;--si-blue:#0866f5;background:var(--si-bg);color:var(--si-ink);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;padding:24px;border-radius:8px;font-size:13px;line-height:1.5;color-scheme:light}
    #si-dashboard-preview *{box-sizing:border-box}#si-dashboard-preview h1{font-size:25px;margin:0;font-weight:700;letter-spacing:-1px}#si-dashboard-preview h2{font-size:15px;margin:0;font-weight:700}#si-dashboard-preview button,#si-dashboard-preview select{font:inherit;color:inherit;cursor:pointer}#si-dashboard-preview .si-head{display:flex;align-items:center;gap:10px;margin-bottom:22px}#si-dashboard-preview .si-draft{margin-left:auto;color:var(--si-muted);font-size:11px}#si-dashboard-preview .si-info{display:inline-grid;place-items:center;border:1px solid #aac1df;background:white;color:#30659e;border-radius:50%;width:20px;height:20px;padding:0;font-weight:700;flex-shrink:0}#si-dashboard-preview .si-layout{display:grid;grid-template-columns:30% minmax(0,1fr);gap:16px}#si-dashboard-preview .si-panel{background:var(--si-panel);border:1px solid var(--si-line);border-radius:10px;padding:16px;min-width:0}#si-dashboard-preview .si-panel-head{display:flex;align-items:center;gap:7px;margin-bottom:16px}#si-dashboard-preview .si-map-panel{display:flex;flex-direction:column}#si-dashboard-preview .si-region{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--si-line);padding-bottom:13px;margin-bottom:16px}#si-dashboard-preview select{background:white;border:1px solid #cbdcf0;border-radius:5px;padding:5px 8px;max-width:100%}#si-dashboard-preview .si-map{position:relative;flex:1;min-height:400px;background:#f4f8fd;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:45px 25px 45px 50px}#si-dashboard-preview .si-map-placeholder{text-align:center;color:#6e88a6;border:1px dashed #b6cce4;border-radius:14px;padding:42px 12px;width:100%}#si-dashboard-preview .si-map-placeholder svg{width:34px;height:34px;margin:auto auto 14px}#si-dashboard-preview .si-map-placeholder strong{display:block;font-size:15px;margin-bottom:7px}#si-dashboard-preview .si-map-placeholder span{font-size:11px}#si-dashboard-preview .si-legend{position:absolute;left:13px;top:27%;display:flex;align-items:center;flex-direction:column;gap:8px;font-size:11px;color:var(--si-muted)}#si-dashboard-preview .si-gradient{height:160px;width:10px;background:linear-gradient(#0866f5,#dceeff);border-radius:4px}#si-dashboard-preview .si-right{min-width:0;display:grid;gap:16px}#si-dashboard-preview .si-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}#si-dashboard-preview .si-metric{padding:14px 10px;background:white;border:1px solid var(--si-line);border-radius:8px}#si-dashboard-preview .si-metric-label{display:flex;align-items:center;gap:5px;font-size:12px;white-space:nowrap}#si-dashboard-preview .si-metric strong{display:block;font-size:22px;letter-spacing:-.7px;margin-top:12px;font-variant-numeric:tabular-nums;white-space:nowrap}#si-dashboard-preview .si-metric strong small{font-size:12px;font-weight:400;letter-spacing:0}#si-dashboard-preview .si-period strong{font-size:17px;line-height:1.3;margin-top:9px}#si-dashboard-preview .si-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px}#si-dashboard-preview .si-chart{padding:14px 12px}#si-dashboard-preview .si-chart .si-panel-head{margin-bottom:12px;gap:5px}#si-dashboard-preview .si-chart h2{font-size:14px}#si-dashboard-preview .si-controls{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:9px;color:var(--si-muted);font-size:11px}#si-dashboard-preview .si-controls select{padding:3px 5px;font-size:11px}#si-dashboard-preview .si-rows{height:330px;overflow-y:scroll;scrollbar-color:#a1b8d5 #eff4fa;scrollbar-width:thin;padding-right:6px}#si-dashboard-preview .si-row{display:grid;grid-template-columns:88px minmax(0,1fr) 57px;align-items:center;gap:5px;min-height:61px;border-bottom:1px solid #f0f4f9}#si-dashboard-preview .si-name{font-size:12px;font-weight:600;min-width:0}#si-dashboard-preview .si-sub{font-size:10px;color:var(--si-muted);font-weight:400;display:block;margin-top:3px;line-height:1.45}#si-dashboard-preview .si-track{height:12px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),#e6eef9 calc(25% - 1px),#e6eef9 25%);position:relative}#si-dashboard-preview .si-bar{display:block;height:100%;background:linear-gradient(90deg,#95c3ff,#287fff);border-radius:0 2px 2px 0}#si-dashboard-preview .si-zero{position:absolute;left:0;top:0;bottom:0;width:2px;background:#287fff}#si-dashboard-preview .si-value{text-align:right;font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}#si-dashboard-preview .si-scale{display:flex;justify-content:space-between;margin:10px 0 0 93px;padding-right:62px;font-size:10px;color:var(--si-muted)}#si-dashboard-preview .si-policy-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}#si-dashboard-preview .si-policy-item{background:#f2f7ff;padding:12px 9px;border-radius:6px;min-width:0}#si-dashboard-preview .si-policy-item div{display:flex;align-items:center;gap:4px;font-size:11px;flex-wrap:wrap}#si-dashboard-preview .si-policy-item strong{display:block;font-size:19px;margin-top:9px}#si-dashboard-preview .si-policy-item small{font-size:12px;font-weight:400}#si-dashboard-preview .si-policy .si-panel-head{margin-bottom:12px}#si-dashboard-preview .si-proposal{font-size:10px;color:#3565a5;margin-left:auto}#si-dashboard-preview .si-help{background:white;border:1px solid #b5cdeb;border-radius:8px;padding:14px 16px;margin-bottom:16px;box-shadow:0 4px 14px #1234650d;display:flex;gap:14px;align-items:start}#si-dashboard-preview .si-help[hidden]{display:none}#si-dashboard-preview .si-help p{margin:0;flex:1;white-space:pre-line;font-size:12px}#si-dashboard-preview .si-help button{border:0;background:transparent;color:var(--si-muted)}
    @media(max-width:850px){#si-dashboard-preview{padding:16px}#si-dashboard-preview .si-layout{grid-template-columns:1fr}#si-dashboard-preview .si-map{min-height:250px}#si-dashboard-preview .si-map-placeholder{max-width:280px;padding:25px}#si-dashboard-preview .si-legend{top:30px}#si-dashboard-preview .si-map-panel{min-height:360px}#si-dashboard-preview .si-charts{gap:12px}}@media(max-width:520px){#si-dashboard-preview .si-metrics,#si-dashboard-preview .si-policy-grid{grid-template-columns:1fr 1fr}#si-dashboard-preview .si-charts{grid-template-columns:1fr}#si-dashboard-preview .si-head{flex-wrap:wrap}#si-dashboard-preview .si-draft{margin-left:0}#si-dashboard-preview .si-row{grid-template-columns:105px minmax(0,1fr) 64px}}
  </style>
  <header class="si-head"><h1>시설 이용 현황</h1><button class="si-info" data-help="overview" aria-label="화면 설명 및 자료 출처">!</button><span class="si-draft">배치 시안 · 수치는 제공 화면 기준</span></header>
  <div class="si-help" hidden aria-live="polite"><p></p><button type="button" aria-label="설명 닫기">닫기</button></div>
  <div class="si-layout">
    <section class="si-panel si-map-panel"><div class="si-panel-head"><h2>지역별 이용현황</h2><button class="si-info" data-help="map" aria-label="지도 설명">!</button></div><div class="si-region"><label for="si-region">조회 지역</label><select id="si-region"><option>전국</option><option>서울</option><option>경기</option><option>부산</option></select></div><div class="si-map"><div class="si-legend"><span>많음</span><div class="si-gradient"></div><span>적음</span></div><div class="si-map-placeholder"><i data-lucide="map-pinned" aria-hidden="true"></i><strong>행정경계 지도 영역</strong><span>지도 확대 배치 · 경계 표시는 구현 시 적용</span></div></div></section>
    <div class="si-right">
      <section class="si-metrics" aria-label="상단 통계">
        <div class="si-metric"><div class="si-metric-label">이용 시설 <button class="si-info" data-help="facilities" aria-label="이용 시설 집계 기준">!</button></div><strong>25,425 <small>개</small></strong></div>
        <div class="si-metric"><div class="si-metric-label">개설 강좌 <button class="si-info" data-help="courses" aria-label="개설 강좌 집계 기준">!</button></div><strong>59,613 <small>건</small></strong></div>
        <div class="si-metric"><div class="si-metric-label">신청 인원 <button class="si-info" data-help="requests" aria-label="신청 인원 집계 기준">!</button></div><strong>2,075,456 <small>명</small></strong></div>
        <div class="si-metric"><div class="si-metric-label">관측 개설 인원 <button class="si-info" data-help="period" aria-label="관측 개설 인원 기준 확인 중">!</button></div><strong>— <small>명</small></strong></div>
      </section>
      <div class="si-charts">
        <section class="si-panel si-chart"><div class="si-panel-head"><h2>시군구별 신청인원</h2><button class="si-info" data-help="normalization" aria-label="그래프 표시 기준">!</button></div><div class="si-controls"><span>단위: 명</span><select aria-label="시군구 신청인원 정렬" data-sort="areas"><option value="desc">많은 순</option><option value="asc">적은 순</option></select></div><div class="si-rows" id="si-areas" aria-label="시군구별 신청인원 목록"></div><div class="si-scale"><span>최소</span><span>최대</span></div></section>
        <section class="si-panel si-chart"><div class="si-panel-head"><h2>종목별 신청인원</h2><button class="si-info" data-help="sports" aria-label="종목별 집계 설명">!</button></div><div class="si-controls"><span>단위: 명 · 전체 종목</span><select aria-label="종목별 신청인원 정렬" data-sort="sports"><option value="desc">많은 순</option><option value="asc">적은 순</option></select></div><div class="si-rows" id="si-sports" aria-label="종목별 신청인원 목록"></div><div class="si-scale"><span>최소</span><span>최대</span></div></section>
      </div>
      <section class="si-panel si-policy"><div class="si-panel-head"><h2>정책 참고 지표</h2><button class="si-info" data-help="policy" aria-label="정책 참고 지표 산식">!</button></div><div class="si-policy-grid"><div class="si-policy-item"><div>시설당 강좌</div><strong>2.3 <small>건</small></strong></div><div class="si-policy-item"><div>강좌당 신청인원</div><strong>34.8 <small>명</small></strong></div><div class="si-policy-item"><div>수혜율</div><strong>미연결</strong></div><div class="si-policy-item"><div>시설당 신청인원</div><strong>81.6 <small>명</small></strong></div></div></section>
    </div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('si-dashboard-preview');
    const help={overview:'스포츠강좌이용권 이용현황 자료에서 시설·강좌·신청인원을 확인합니다.\n출처: 스포츠강좌이용권 이용현황 정보.csv\n시안 수치는 제공된 화면을 사용했습니다. 실제 데이터를 다시 집계한 결과는 아닙니다.',facilities:'시도·시군구 코드, 시설명, 주소, 상세주소로 구분한 시설 수입니다.\n같은 시설이 여러 개설월에 기록돼도 한 번 집계합니다. 식별 정보가 부족한 행은 제외합니다.',courses:'시설 식별 정보와 강좌번호를 조합한 고유 강좌 수입니다.\n같은 강좌의 개설월별 기록은 중복 집계하지 않습니다.',requests:'개설월별 COURSE_REQST_NMPR_CO의 합계입니다.\n여러 달 신청한 사람이 반복 포함될 수 있으므로 고유 이용자 수와 다릅니다.',period:'인원 지표로 변경합니다. 집계 대상·기간·중복 처리 기준은 확인 중입니다.\n기존 신청 인원과의 차이가 정의되기 전까지 임의로 수치를 계산하지 않습니다.',map:'지도에서 지역을 선택하는 구조를 제안합니다. 지역 선택은 지도 상단에만 배치합니다.\n이 시안은 지도 크기·위치·범례 배치를 보여주는 자리표시자입니다. 선택 시 실제 자료 필터링은 구현 단계에 적용합니다.',normalization:'현재 조회 범위 전체 항목의 최소값을 0%, 최대값을 100%로 표시합니다.\n(신청인원 − 최소값) ÷ (최대값 − 최소값)\n최소값은 시작점에 표시하고 실제 인원은 오른쪽에 고정합니다. 모두 같은 값이면 같은 길이로 표시합니다. 막대는 인원 자체의 배수가 아닌 범위 내 상대 위치입니다.',sports:'상위 5개 제한을 없애고 전체 종목을 스크롤하여 조회하는 구조입니다.\n종목별 시설 수·강좌 수는 별도 중복 제거 집계가 필요하므로 시안에는 — 로 표시했습니다. 제공 화면에 없는 종목의 인원도 임의로 채우지 않았습니다.\n막대는 확인 가능한 예시값 내 최소·최대로 정규화했습니다.',policy:'시설당 강좌 = 강좌 수 ÷ 시설 수\n강좌당 신청인원 = 신청인원 합계 ÷ 강좌 수\n수혜율 = 지원대상·수급인원 자료가 없어 미연결\n시설당 신청인원 = 신청인원 합계 ÷ 시설 수'};
    const box=root.querySelector('.si-help');root.querySelectorAll('[data-help]').forEach(b=>b.addEventListener('click',()=>{box.querySelector('p').textContent=help[b.dataset.help];box.hidden=false}));box.querySelector('button').addEventListener('click',()=>box.hidden=true);
    root.querySelector('#si-region').addEventListener('change',e=>{box.querySelector('p').textContent=e.target.value+' 선택 상태 예시입니다. 통계는 제공 화면의 전국 수치를 유지합니다.';box.hidden=false});
    const areas=[['안산시',55713,'경기 · 시설 386개 · 강좌 974건'],['창원시',43021,'경남 · 시설 550개 · 강좌 1,243건'],['전주시',42926,'전북 · 시설 435개 · 강좌 1,016건'],['김해시',41580,'경남 · 시설 442개 · 강좌 1,069건'],['청주시',37696,'충북 · 시설 451개 · 강좌 1,032건'],['남동구',33877,'인천 · 시설 305개 · 강좌 755건'],['제주시',30598,'제주 · 시설 346개 · 강좌 904건'],['달서구',30438,'대구 · 시설 302개 · 강좌 663건'],['광산구',30427,'광주 · 시설 328개 · 강좌 634건'],['북구',30195,'광주 · 시설 339개 · 강좌 674건']];
    const sports=[['태권도',1055064],['기타종목',138745],['합기도',131239],['헬스',98655],['복싱',88310],['수영',null],['축구',null],['검도',null],['유도',null],['배드민턴',null]].map(r=>[r[0],r[1],'시설 —개 · 강좌 —건']);
    function draw(kind,order){const data=kind==='areas'?areas:sports;const known=data.filter(r=>r[1]!==null).map(r=>r[1]);const min=Math.min(...known),max=Math.max(...known);const rows=[...data].sort((a,b)=>a[1]===null?1:b[1]===null?-1:(order==='asc'?1:-1)*(a[1]-b[1]));const target=root.querySelector('#si-'+kind);target.replaceChildren();rows.forEach(([name,value,sub])=>{const row=document.createElement('div');row.className='si-row';const label=document.createElement('div');label.className='si-name';label.textContent=name;const small=document.createElement('span');small.className='si-sub';small.textContent=sub;label.append(small);const track=document.createElement('div');track.className='si-track';track.setAttribute('aria-hidden','true');if(value!==null){const bar=document.createElement('span');bar.className=value===min&&max!==min?'si-zero':'si-bar';bar.style.width=max===min?'100%':((value-min)/(max-min)*100)+'%';if(value===min&&max!==min)bar.style.width='2px';track.append(bar)}const number=document.createElement('span');number.className='si-value';number.textContent=value===null?'—':value.toLocaleString('ko-KR');row.append(label,track,number);target.append(row)})}
    draw('areas','desc');draw('sports','desc');root.querySelectorAll('[data-sort]').forEach(s=>s.addEventListener('change',()=>draw(s.dataset.sort,s.value)));
    const state={mapWidth:30};function adjust(){root.querySelector('.si-layout').style.gridTemplateColumns=window.innerWidth>850?state.mapWidth+'% minmax(0,1fr)':'1fr'}
    if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:adjust});tweak.addSlider(state,'mapWidth',{label:'지도 너비',min:26,max:38,unit:'%'})}
  })();
  </script>
</div>
